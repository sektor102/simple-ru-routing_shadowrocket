name: Build Shadowrocket RU routing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 4"

permissions:
  contents: write

concurrency:
  group: shadowrocket-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANTIFILTER_DOWNLOAD: https://community.antifilter.download/list/domains.lst
      REFILTER_ALL: https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/domains_all.lst

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Checkout upstream geosite repo
        uses: actions/checkout@v4
        with:
          repository: frayZV/simple-ru-geosite
          ref: master
          path: upstream-geosite

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream-geosite/go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare source data lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          declare -A fetched

          fetch_list() {
            local name="$1"
            [[ "${fetched[$name]:-}" == "1" ]] && return
            fetched[$name]=1

            curl --fail -s -o "data/$name" \
              "https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/$name"

            readarray -t includes < <(
              grep '^include:' "data/$name" \
                | cut -d':' -f2- \
                | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
                || true
            )

            for inc in "${includes[@]}"; do
              [[ -n "$inc" ]] && fetch_list "$inc"
            done
          }

          for root in category-ru apple private youtube; do
            fetch_list "$root"
          done

          cp upstream-geosite/data/twitch data/twitch

          mkdir -p filtered
          curl -sSL "$ANTIFILTER_DOWNLOAD" -o filtered/antifilter.lst
          curl -sSL "$REFILTER_ALL" -o filtered/refilter.lst

          (
            cat filtered/antifilter.lst filtered/refilter.lst \
            | grep -E '\.(ru|su|xn--80adxhks|xn--80asehdb|xn--80aswg|xn--c1avg|xn--d1acj3b|xn--p1acf|xn--p1ai)$'
          ) | sort | uniq > data/category-ban-ru

          echo "Prepared data files:"
          ls -R data

      - name: Generate flat source lists
        run: |
          mkdir -p dist/raw
          cd upstream-geosite
          go mod tidy
          go run main.go \
            --datapath=../data \
            --outputdir=../dist/raw \
            --exportlists=category-ban-ru,category-ru,apple,twitch,youtube,private
          cd ..
          echo "Generated raw files:"
          ls -R dist/raw

      - name: Build Shadowrocket lists and config
        run: |
          python scripts/build_shadowrocket.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add release/
          git commit -m "chore: refresh Shadowrocket routing"
          git push
